# LangChain Community 包拆分与集成迁移规则。
# 这些规则只负责定位文件；具体替换由 LLM 结合知识文档生成。
rules:
  - id: lc_community_chroma_import
    kind: deprecated_api
    type: from_import
    module: langchain_community.vectorstores
    name: Chroma
    replacement: from langchain_chroma import Chroma
    message: Chroma 已迁移到 langchain_chroma，请更新导入
    docs: langchain_community_upgrade
    package: langchain_community
    severity: medium

